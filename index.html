<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tier List เพลงประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17141c; --panel:#211d29; --panel-2:#2a2534; --line:#3a3446; --text:#f3eefb; --dim:#a79fb8;
  --accent:#f5c542;
  --card:96px;
  --t1:#f5c542; --t2:#ff6b4a; --t3:#a98bff; --t4:#35c9b5; --t5:#a8896a;
  --display:"Mitr","Noto Sans Thai",system-ui,sans-serif;
  --body:"Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.5;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0}
.sub{color:var(--dim);font-size:14px;margin-top:6px}
.clock{text-align:right}
.clock b{font-family:var(--display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.clock span{color:var(--dim);font-size:13px}
.daybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.daybar .label{font-family:var(--display);font-size:18px;min-width:150px;text-align:center}
button{font-family:var(--body);font-size:14px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--dim)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.tiers{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.tier{display:flex;border-bottom:1px solid var(--line);min-height:calc(var(--card) + 62px)}
.tier:last-child{border-bottom:0}
.tier-label{flex:0 0 112px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;
  font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;color:#1b1722;background:var(--c)}
.zone{flex:1;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;min-width:0}
.zone.over{background:rgba(255,255,255,.05)}
.pool-wrap{margin-top:24px}
.pool-wrap h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0 0 4px}
.pool-wrap p{margin:0 0 10px;color:var(--dim);font-size:13px}
.pool{min-height:calc(var(--card) + 66px);border:1px dashed var(--line);border-radius:12px;background:var(--panel)}
.pool.over{border-color:var(--accent)}
.pool.done{display:flex;align-items:center;justify-content:center;color:var(--dim);min-height:90px}
.song{width:var(--card);flex:0 0 auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.song:active{cursor:grabbing}
.song .cover{width:var(--card);height:var(--card);border-radius:6px;background:var(--panel-2) center/cover no-repeat;display:block;
  object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.song .name{font-size:12px;font-weight:500;line-height:1.3;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.song .artist{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song.dragging{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;width:var(--card);transform:rotate(-3deg) scale(1.06);
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.55))}
.ghost .name,.ghost .artist{display:none}
.marker{width:4px;height:var(--card);border-radius:2px;background:var(--accent);flex:0 0 auto;align-self:flex-start;margin:0 -2px}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.foot small{color:var(--dim);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#17141c;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){
  :root{--card:78px}
  .tier-label{flex-basis:72px;font-size:16px}
  .zone{padding:8px;gap:6px}
  .clock{text-align:left}
  .song .name{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Tier List เพลงประจำวัน</h1>
      <div class="sub" id="progress"></div>
    </div>
    <div class="clock"><b id="countdown">--:--:--</b><span>เหลือเวลาก่อนเปลี่ยน 10 เพลงใหม่ (เที่ยงคืนเวลาไทย)</span></div>
  </header>

  <div class="daybar">
    <button id="prev" aria-label="วันก่อนหน้า">‹ วันก่อนหน้า</button>
    <div class="label" id="dayLabel"></div>
    <button id="next" aria-label="วันถัดไป">วันถัดไป ›</button>
    <div class="spacer"></div>
    <button id="copy">คัดลอกผลจัดอันดับ</button>
    <button id="reset">เริ่มจัดใหม่</button>
  </div>

  <div class="tiers" id="tiers"></div>

  <div class="pool-wrap">
    <h2>เพลงที่ยังไม่ได้จัด</h2>
    <p>ลากปกอัลบั้มไปวางในแถวที่ต้องการ ลากกลับมาได้ และสลับลำดับในแถวเดียวกันได้</p>
    <div class="pool" id="pool" data-zone="pool"></div>
  </div>

  <div class="foot"><small>ผลที่จัดเก็บไว้ในเบราว์เซอร์เครื่องนี้ ทุกคนจะได้ 10 เพลงชุดเดียวกันในแต่ละวัน</small></div>
</div>

","ab67616d0000b273ee58b8ce747da91d69a862cc"],["Songbird","Oasis","ab67616d0000b273f687135853a4488b2178d0bf"],["All In the Family (feat. Fred Durst)","Korn, Fred Durst","ab67616d0000b2734e492e787ed64de43c3a3a21"],["นอนไม่หลับ (THE REMAKE)","Three Man Down","ab67616d0000b2731185aad590094218e266971c"],["Afterlife","Avenged Sevenfold","ab67616d0000b27333c52ca8309741c6999ca742"]];
const TIERS = [
  {id:"somdej", name:"สมเด็จ",  c:"var(--t1)"},
  {id:"huaja",  name:"หัวจ่าย", c:"var(--t2)"},
  {id:"samu",   name:"ซามู",    c:"var(--t3)"},
  {id:"sabaho", name:"สะโบโห้", c:"var(--t4)"},
  {id:"tuiduy", name:"ตุ๋ยดุ้ย", c:"var(--t5)"}
];
const PER_DAY = 10;
const N = SONGS.length;
const DAYS_PER_CYCLE = Math.floor(N / PER_DAY);
const TZ_MS = 7 * 3600 * 1000;               // เวลาไทย UTC+7
const DAY_MS = 86400000;
const START_DAY = Math.floor(Date.UTC(2026, 9, 14) / DAY_MS);   // วันที่ 1 = 14 ต.ค. 2569 (2026)

const bkkDay = () => Math.floor((Date.now() + TZ_MS) / DAY_MS);
const todayIdx = () => Math.max(0, bkkDay() - START_DAY);

/* ---------- สุ่มแบบกำหนดผลได้ (seed ตามรอบ) ไม่ซ้ำจนกว่าจะครบทุกเพลง ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cycleCache = {};
function cycleOrder(c){
  if(cycleCache[c]) return cycleCache[c];
  const arr = Array.from({length:N}, (_, i) => i);
  const rnd = mulberry32(Math.imul(c + 1, 0x9E3779B1) ^ 0x1975);
  for(let i = N - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return cycleCache[c] = arr;
}
function songsForDay(d){
  const c = Math.floor(d / DAYS_PER_CYCLE), k = d % DAYS_PER_CYCLE;
  return cycleOrder(c).slice(k * PER_DAY, k * PER_DAY + PER_DAY);
}

/* ---------- สถานะ ---------- */
let viewDay = todayIdx();
let state = null;   // {somdej:[ids],..., pool:[ids]}
const key = d => "tierlist-day-" + d;

function load(d){
  const ids = songsForDay(d);
  let s = null;
  try { s = JSON.parse(localStorage.getItem(key(d))); } catch(e){}
  const fresh = {pool: ids.slice()}; TIERS.forEach(t => fresh[t.id] = []);
  if(!s) return fresh;
  const out = {pool: []}; TIERS.forEach(t => out[t.id] = []);
  const seen = new Set();
  [...TIERS.map(t => t.id), "pool"].forEach(z => (s[z] || []).forEach(id => {
    if(ids.includes(id) && !seen.has(id)){ seen.add(id); out[z].push(id); }
  }));
  ids.forEach(id => { if(!seen.has(id)) out.pool.push(id); });
  return out;
}
function save(){ try { localStorage.setItem(key(viewDay), JSON.stringify(state)); } catch(e){} }

/* ---------- วาดหน้าจอ ---------- */
const $ = s => document.querySelector(s);
const tiersEl = $("#tiers"), poolEl = $("#pool");

function songEl(id){
  const [name, artist, img] = SONGS[id];
  const el = document.createElement("div");
  el.className = "song"; el.dataset.id = id; el.title = name + " — " + artist;
  const im = document.createElement("img");
  im.className = "cover"; im.alt = ""; im.draggable = false; im.loading = "lazy";
  im.src = "https://i.scdn.co/image/" + img;
  im.referrerPolicy = "no-referrer";
  im.onerror = () => { im.removeAttribute("src"); im.style.background = "linear-gradient(135deg,#4a3f63,#2a2534)"; };
  const n = document.createElement("div"); n.className = "name"; n.textContent = name;
  const a = document.createElement("div"); a.className = "artist"; a.textContent = artist;
  el.append(im, n, a);
  el.addEventListener("pointerdown", onDown);
  return el;
}

function render(){
  tiersEl.innerHTML = "";
  TIERS.forEach(t => {
    const row = document.createElement("div"); row.className = "tier";
    const lab = document.createElement("div"); lab.className = "tier-label"; lab.textContent = t.name; lab.style.setProperty("--c", t.c);
    const zone = document.createElement("div"); zone.className = "zone"; zone.dataset.zone = t.id;
    state[t.id].forEach(id => zone.appendChild(songEl(id)));
    row.append(lab, zone); tiersEl.appendChild(row);
  });
  poolEl.innerHTML = "";
  poolEl.className = "pool";
  poolEl.style.display = "flex"; poolEl.style.flexWrap = "wrap"; poolEl.style.gap = "8px"; poolEl.style.padding = "10px"; poolEl.style.alignContent = "flex-start";
  state.pool.forEach(id => poolEl.appendChild(songEl(id)));
  if(!state.pool.length){
    poolEl.classList.add("done"); poolEl.textContent = "จัดครบ 10 เพลงแล้ว";
  }
  header();
}

function dateLabel(d){
  const t = new Date((START_DAY + d) * DAY_MS);
  return t.toLocaleDateString("th-TH", {day:"numeric", month:"short", year:"numeric", timeZone:"UTC"});
}
function header(){
  const today = todayIdx();
  $("#dayLabel").textContent = "วันที่ " + (viewDay + 1) + " · " + dateLabel(viewDay) + (viewDay === today ? " (วันนี้)" : "");
  $("#prev").disabled = viewDay <= 0;
  $("#next").disabled = viewDay >= today;
  const c = Math.floor(viewDay / DAYS_PER_CYCLE), k = viewDay % DAYS_PER_CYCLE;
  const used = (k + 1) * PER_DAY;
  $("#progress").textContent = "สุ่มมาแล้ว " + used.toLocaleString("th-TH") + " จาก " + N.toLocaleString("th-TH") + " เพลง" + (c > 0 ? " · รอบที่ " + (c + 1) : "");
}

/* ---------- นับถอยหลัง ---------- */
function tick(){
  const next = (bkkDay() + 1) * DAY_MS - TZ_MS;
  let s = Math.max(0, Math.floor((next - Date.now()) / 1000));
  const p = n => String(n).padStart(2, "0");
  $("#countdown").textContent = p(Math.floor(s / 3600)) + ":" + p(Math.floor(s % 3600 / 60)) + ":" + p(s % 60);
  header();
  if(todayIdx() > viewDay && viewDay === todayIdx() - 1 && !dragging && !wasToday){ }
}
let wasToday = false;
let lastToday = todayIdx();
setInterval(() => {
  tick();
  const t = todayIdx();
  if(t !== lastToday){ const follow = viewDay === lastToday; lastToday = t; if(follow && !dragging){ viewDay = t; state = load(viewDay); render(); toast("เปลี่ยนเป็น 10 เพลงใหม่ของวันนี้แล้ว"); } }
}, 1000);

/* ---------- ลากวาง (รองรับเมาส์และจอสัมผัส) ---------- */
let dragging = null;
function onDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const el = e.currentTarget;
  dragging = {el, id: +el.dataset.id, sx: e.clientX, sy: e.clientY, active: false, ghost: null, marker: null, zone: null, index: 0, pid: e.pointerId};
  el.setPointerCapture(e.pointerId);
  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", onUp);
}
function startDrag(e){
  const d = dragging, r = d.el.getBoundingClientRect();
  d.active = true; d.ox = e.clientX - r.left; d.oy = e.clientY - r.top;
  const g = d.el.cloneNode(true); g.classList.add("ghost"); g.classList.remove("dragging");
  g.style.width = r.width + "px";
  document.body.appendChild(g); d.ghost = g;
  d.marker = document.createElement("div"); d.marker.className = "marker";
  d.el.classList.add("dragging");
}
function zoneAt(x, y){
  const g = dragging.ghost; g.style.display = "none";
  const hit = document.elementFromPoint(x, y); g.style.display = "";
  return hit && hit.closest("[data-zone]");
}
function insertIndex(zone, x, y){
  const kids = [...zone.querySelectorAll(".song")].filter(k => k !== dragging.el);
  for(let i = 0; i < kids.length; i++){
    const r = kids[i].getBoundingClientRect();
    if(y < r.top) return i;
    if(y <= r.bottom + 40 && x < r.left + r.width / 2) return i;
  }
  return kids.length;
}
function onMove(e){
  const d = dragging; if(!d) return;
  if(!d.active){
    if(Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return;
    startDrag(e);
  }
  d.ghost.style.left = (e.clientX - d.ox) + "px";
  d.ghost.style.top = (e.clientY - d.oy) + "px";
  document.querySelectorAll(".over").forEach(z => z.classList.remove("over"));
  const zone = zoneAt(e.clientX, e.clientY);
  d.zone = zone;
  if(zone){
    zone.classList.add("over");
    d.index = insertIndex(zone, e.clientX, e.clientY);
    const kids = [...zone.querySelectorAll(".song")].filter(k => k !== d.el);
    zone.insertBefore(d.marker, kids[d.index] || null);
    // autoscroll
    if(e.clientY < 70) window.scrollBy(0, -12); else if(window.innerHeight - e.clientY < 70) window.scrollBy(0, 12);
  } else if(d.marker.parentNode) d.marker.remove();
}
function onUp(e){
  const d = dragging; if(!d) return;
  const el = d.el;
  el.removeEventListener("pointermove", onMove);
  el.removeEventListener("pointerup", onUp);
  el.removeEventListener("pointercancel", onUp);
  try { el.releasePointerCapture(d.pid); } catch(_){}
  if(d.active){
    d.ghost.remove(); d.marker.remove();
    document.querySelectorAll(".over").forEach(z => z.classList.remove("over"));
    if(d.zone && e.type !== "pointercancel"){
      Object.keys(state).forEach(z => state[z] = state[z].filter(x => x !== d.id));
      const zid = d.zone.dataset.zone;
      state[zid].splice(Math.min(d.index, state[zid].length), 0, d.id);
      save();
    }
    render();
  }
  dragging = null;
}

/* ---------- ปุ่มต่างๆ ---------- */
$("#prev").onclick = () => { if(viewDay > 0){ viewDay--; state = load(viewDay); render(); } };
$("#next").onclick = () => { if(viewDay < todayIdx()){ viewDay++; state = load(viewDay); render(); } };
$("#reset").onclick = () => {
  if(!confirm("เริ่มจัดอันดับของวันนี้ใหม่ทั้งหมด?")) return;
  try { localStorage.removeItem(key(viewDay)); } catch(e){}
  state = load(viewDay); render();
};
$("#copy").onclick = async () => {
  const lines = ["Tier List เพลงประจำวัน · " + dateLabel(viewDay)];
  TIERS.forEach(t => lines.push(t.name + ": " + (state[t.id].map(id => SONGS[id][0]).join(", ") || "-")));
  const txt = lines.join("\n");
  try { await navigator.clipboard.writeText(txt); toast("คัดลอกแล้ว"); }
  catch(e){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("คัดลอกแล้ว");}catch(_){toast("คัดลอกไม่สำเร็จ");} ta.remove(); }
};
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }

state = load(viewDay); render(); tick();
</script>
